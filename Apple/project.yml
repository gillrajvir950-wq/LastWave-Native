name: LastWaveApple
options:
  bundleIdPrefix: org.lastwave.community
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  createIntermediateGroups: true
targets:
  LastWave-iOS:
    type: application
    platform: iOS
    sources: [LastWaveApple]
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: LastWave
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lastwave.community.ios
        MARKETING_VERSION: 0.11.0
        CURRENT_PROJECT_VERSION: 11
        SWIFT_VERSION: '5.9'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
  LastWave-macOS:
    type: application
    platform: macOS
    sources: [LastWaveApple]
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: LastWave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lastwave.community.macos
        MARKETING_VERSION: 0.10.0
        CURRENT_PROJECT_VERSION: 10
        SWIFT_VERSION: '5.9'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
